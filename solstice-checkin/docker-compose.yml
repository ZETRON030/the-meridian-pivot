services:
  postgres:
    image: postgres:16-alpine
    container_name: solstice-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: solstice_user
      POSTGRES_PASSWORD: solstice_password
      POSTGRES_DB: solstice_checkin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U solstice_user -d solstice_checkin"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: solstice-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: solstice_user
      RABBITMQ_DEFAULT_PASS: solstice_password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infrastructure/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test:
        [
          "CMD",
          "rabbitmq-diagnostics",
          "-q",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    container_name: solstice-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    container_name: solstice-worker
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  mock-vendor:
    build:
      context: .
      dockerfile: infrastructure/docker/mock-vendor.Dockerfile
    container_name: solstice-mock-vendor
    restart: unless-stopped
    environment:
      NODE_ENV: development
      MOCK_VENDOR_PORT: 4000
      VENDOR_WEBHOOK_URL: http://api:3000/api/webhooks/vendor
      MOCK_VENDOR_AUTO_CONFIRM: "true"
      MOCK_VENDOR_CONFIRMATION_DELAY_MS: "3000"
    ports:
      - "4000:4000"
    depends_on:
      api:
        condition: service_started

  kiosk:
    build:
      context: .
      dockerfile: infrastructure/docker/kiosk.Dockerfile
    container_name: solstice-kiosk
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
  rabbitmq_data: